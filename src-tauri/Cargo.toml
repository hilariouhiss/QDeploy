[package]
name = "qdeploy"
version = "0.1.0"
description = "QDeploy"
edition = "2021"

[lib]
name = "qdeploy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.10"
walkdir = "2"
globset = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
